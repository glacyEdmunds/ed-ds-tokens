name: Sync Tokens to GitLab

on:
  push:
    branches:
      - figma-tokens  # The GitHub branch Tokens Studio pushes to

jobs:
  sync-to-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configure Git and Push to GitLab
        env:
          GITLAB_REPO: ${{ secrets.GITLAB_REPO_URL }}
          GITLAB_TOKEN: ${{ secrets.CI_PUSH_TOKEN }}
          GITLAB_CA_CERT_B64: ${{ secrets.GITLAB_CA_CERT_B64 }}
        run: |
          # Decode base64 cert and write to file
          echo "$GITLAB_CA_CERT_B64" | base64 --decode > root-ca.pem

          # Debug: verify cert
          echo "🔍 Cert file details:"
          ls -l root-ca.pem
          echo "----- BEGIN CERT DUMP -----"
          cat root-ca.pem
          echo "------ END CERT DUMP ------"

          # Configure Git
          git config --global user.name "Greg Lacy"
          git config --global user.email "glacy@edmunds.com"
          git config --global http.sslCAInfo "$PWD/root-ca.pem"

          # Add GitLab remote and push
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}
          git push gitlab figma-tokens --force

          echo "✅ Tokens synced to GitLab successfully."
